# Perfil de teste: banco em memória, sem dependência do Supabase.
spring.datasource.url=jdbc:h2:mem:eranitor;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

api.security.token.secret=segredo-de-teste-eranitor-nao-usar-em-producao
api.security.token.expiration-hours=2
api.security.refresh.expiration-days=30
api.security.refresh.window-days=7
